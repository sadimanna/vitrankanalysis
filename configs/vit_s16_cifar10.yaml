seed: 42
output_dir: outputs/vit_s16_cifar10

model:
  source: timm
  name: vit_small_patch16_224
  pretrained: true
  lora:
    enabled: false
    r: 8
    alpha: 16
    dropout: 0.0
    target: all

training:
  epochs: 50
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  mixed_precision: false
  log_interval: 50

  scheduler:
    name: cosine
    warmup_epochs: 5
    t_max: 50
    step_size: 10
    gamma: 0.1

  dataset:
    name: cifar10
    data_dir: data
    image_size: 224
    patch_size: 16
    num_workers: 4
    num_classes: 10
    augmentation:
      enabled: false
      resize: 256
      crop: 224
      randaugment: true
      randaugment_ops: 2
      randaugment_magnitude: 9
      normalize: true
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  grad_collect:
    enabled: true
    interval: 100
    param_filter: full
    per_layer: false
    attention_only: false
    mlp_only: false
    subsample: 0
    normalization: l2
    dtype: fp16
    cpu_offload: true

  projection:
    enabled: true
    method: achlioptas
    dim: 512
    chunk_size: 16384
    seed: 123

analysis:
  compute_exact_gram: true
  streaming:
    oja: true
    incremental_pca: true
    frequent_directions: true
    sketch_dim: 128
  spectral:
    energy_thresholds: [0.9, 0.95, 0.99]
    powerlaw_fit: true

visualization:
  enabled: true
  style: paper
  save_formats: [png]
