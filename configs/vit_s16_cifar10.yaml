seed: 42
output_dir: outputs/vit_s16_cifar10

model:
  source: timm
  name: vit_small_patch16_224
  pretrained: true
  lora:
    enabled: true
    r: 128
    alpha: 256
    dropout: 0.0
    target: all

training:
  epochs: 20
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]
  grad_clip_norm: 1.0
  mixed_precision: false
  log_interval: 50

  scheduler:
    name: cosine
    warmup_epochs: 0
    t_max: 20
    step_size: 1
    gamma: 0.1

  dataset:
    name: cifar10
    data_dir: data
    image_size: 32
    patch_size: 16
    num_workers: 4
    num_classes: 10
    augmentation:
      enabled: true
      resize: 32
      crop: 32
      randaugment: true
      randaugment_ops: 2
      randaugment_magnitude: 9
      normalize: true
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  grad_collect:
    enabled: true
    interval: 10
    param_filter: full
    per_layer: false
    attention_only: false
    mlp_only: false
    subsample: 0
    normalization: l2
    dtype: fp16
    cpu_offload: true

  projection:
    enabled: true
    method: achlioptas
    dim: 1024
    chunk_size: 1024 #16384 #4*ln(((50000/128)/10)*100) / (0.01/2 - ((0.1)^3)/3) = 7089
    seed: 123
    save_raw: false

analysis:
  compute_exact_gram: true
  streaming:
    oja: true
    incremental_pca: true
    frequent_directions: true
    sketch_dim: 128
  spectral:
    energy_thresholds: [0.9, 0.95, 0.99]
    powerlaw_fit: true

visualization:
  enabled: true
  style: paper
  save_formats: [png]
